name: CI

# main에 push하거나 PR을 올릴 때마다 조합 엔진 테스트와 pkg 빌드를 검증한다.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    # arm64(Apple Silicon) 러너 — 빌드 타깃이 arm64-apple-macos13.0 이므로 필수.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # 빌드 번호(CFBundleVersion)를 git 커밋 수로 계산하므로 전체 히스토리 필요.
          # (기본 shallow checkout이면 커밋 수가 1로 나옴)
          fetch-depth: 0

      - name: 버전 확인
        run: make version

      - name: 조합 엔진 단위 테스트
        run: make test

      - name: 배포 pkg 빌드 (ad-hoc 서명)
        run: ./scripts/build-pkg.sh

      - name: pkg 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ra1nIME-pkg
          path: build/ra1nIME.pkg
          if-no-files-found: error
