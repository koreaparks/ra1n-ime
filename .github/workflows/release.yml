name: Release

# v1.1.0 처럼 'v'로 시작하는 태그를 push하면
# pkg를 빌드해 GitHub Releases에 자동 게시한다.
on:
  push:
    tags:
      - 'v*'

# gh release create 가 Release를 생성/업로드하려면 쓰기 권한이 필요.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 태그와 VERSION 파일 일치 확인
        run: |
          VERSION="$(cat VERSION)"
          TAG="${GITHUB_REF_NAME#v}"   # 앞의 'v' 제거
          echo "태그=$TAG, VERSION 파일=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::태그($TAG)와 VERSION 파일($VERSION)이 다릅니다. VERSION을 먼저 맞추세요."
            exit 1
          fi

      - name: 조합 엔진 단위 테스트
        run: make test

      - name: 배포 pkg 빌드 (ad-hoc 서명)
        run: ./scripts/build-pkg.sh

      - name: GitHub Release 게시 (pkg 첨부, 재실행 시 덮어쓰기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<EOF
          ra1n IME ${VERSION}

          **설치 전 \`install-guide.html\`을 내려받아 브라우저로 열어보세요.** (설치/삭제/권한 안내)

          개발자 등록 없이 **ad-hoc 서명**으로 배포됩니다. 설치 시 "확인되지 않은 개발자" 경고가 뜰 수 있으며, 우회 방법은 안내서(또는 README)를 참고하세요.
          EOF
          # pkg 파일명에 버전 부여 (예: ra1nIME_v1.0.1.pkg)
          PKG="build/ra1nIME_v${VERSION}.pkg"
          mv build/ra1nIME.pkg "$PKG"
          # 안내서 HTML의 __PKG__ 자리표시자를 실제 pkg 파일명으로 치환한 사본을 첨부
          GUIDE="build/install-guide.html"
          sed "s/__PKG__/ra1nIME_v${VERSION}.pkg/g" docs/install-guide.html > "$GUIDE"
          ASSETS="$PKG $GUIDE"
          # 같은 태그로 재실행돼도 실패하지 않도록: 릴리스가 이미 있으면 덮어쓰고 갱신.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "기존 릴리스 발견 → 에셋 덮어쓰기 + 정보 갱신"
            gh release upload "${GITHUB_REF_NAME}" $ASSETS --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "ra1n IME ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          else
            echo "새 릴리스 생성"
            gh release create "${GITHUB_REF_NAME}" $ASSETS --title "ra1n IME ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          fi
